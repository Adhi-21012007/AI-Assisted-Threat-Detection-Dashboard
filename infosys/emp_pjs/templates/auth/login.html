<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Login | Northstar</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="login"><section class="login-card"><div class="login-mark">✦</div><p class="eyebrow">NORTHSTAR SYSTEMS</p><h1>Employee Portal</h1><p class="muted">Sign in to your protected workspace.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>Employee ID<input name="employee_id" placeholder="e.g. EMP001" required autofocus></label><label>Password<input name="password" type="password" placeholder="Enter your password" required></label><button>Sign in securely <span>→</span></button></form><p class="hint">Demo access: EMP001 / employee123</p></section></body></html>
