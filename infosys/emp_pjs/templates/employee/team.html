{% extends 'base.html' %}{% block heading %}My Team{% endblock %}{% block content %}<section class="glass team-hero"><p class="eyebrow">{{emp.department}}</p><h2>{{emp.team_name}}</h2><p>{{emp['description']}}</p><div><span class="pill">Team lead · {{emp.leader}}</span></div></section><section class="glass"><h2>Team members</h2><div class="members">{% for m in members %}<article><div class="avatar">{{m.name[0]}}</div><b>{{m.name}}</b><small>{{m.designation}}</small><em>{{m.email}}</em></article>{% endfor %}</div></section>{% endblock %}
