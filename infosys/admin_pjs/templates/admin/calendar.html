{% extends 'base.html' %}{% block heading %}Calendar Management{% endblock %}{% block content %}<div class="grid two"><section class="glass"><h2>Publish event</h2><form method="post" class="stack"><label>Title<input name="title" required></label><label>Date<input type="date" name="event_date" required></label><label>Time<input type="time" name="event_time"></label><label>Type<select name="event_type">{% for t in ['Meeting','Team event','Deadline','Holiday','Company event'] %}<option>{{t}}</option>{% endfor %}</select></label><label>Description<textarea name="description"></textarea></label><button>Publish event →</button></form></section><section class="glass"><h2>Company calendar</h2>{% for e in events %}<div class="row"><strong>{{e.event_date[5:]}}</strong><div><span class="badge">{{e.event_type}}</span><b>{{e.title}}</b><small>{{e.description}}</small></div><em>{{e.event_time}}</em></div>{% endfor %}</section></div>{% endblock %}
