{% extends 'base.html' %}{% block heading %}Notifications{% endblock %}{% block content %}<div class="grid two"><section class="glass"><h2>Send notification</h2><form method="post" class="stack"><label>Recipient<select name="recipient"><option value="ALL">All active employees</option><optgroup label="Teams">{% for t in teams %}<option value="TEAM:{{t.id}}">{{t.name}}</option>{% endfor %}</optgroup><optgroup label="Employees">{% for e in employees %}<option value="{{e.employee_id}}">{{e.name}} · {{e.employee_id}}</option>{% endfor %}</optgroup></select></label><label>Type<select name="category">{% for x in ['Company announcement','Attendance notification','Task notification','Ticket notification','Team notification','General notification'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Title<input name="title" required></label><label>Message<textarea name="body" required></textarea></label><button>Send notification →</button></form></section><section class="glass"><h2>Notification history</h2>{% for n in notifications %}<div class="row"><i class="signal"></i><div><b>{{n.title}}</b><small>{{n.recipient}} · {{n.category}} · {{n.body}}</small></div></div>{% endfor %}</section></div>{% endblock %}
