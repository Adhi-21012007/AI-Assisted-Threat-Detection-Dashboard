<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Profile</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body style="
margin:0;
padding:0;
font-family:'Poppins',sans-serif;
background:url('{{ url_for('static', filename='images/background.jpg') }}') no-repeat center center/cover;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;">

<div style="
width:900px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.25);
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,.25);
padding:40px;
color:white;">

    <!-- Header -->

    <div style="
    display:flex;
    align-items:center;
    gap:30px;
    border-bottom:1px solid rgba(255,255,255,.2);
    padding-bottom:25px;">

        <img src="{{ url_for('static', filename='images/profile.jpg') }}"
            style="
            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
            border:5px solid rgba(255,255,255,.3);">

        <div>

            <h1 style="
            margin:0;
            font-size:35px;">
                {{ fullname }}
            </h1>

            <p style="
            margin:10px 0;
            font-size:18px;
            color:#ddd;">
                Security Operations Analyst
            </p>

            <p style="
            margin:0;
            color:#bfbfbf;">
                Employee ID : {{ empid }}
            </p>

        </div>

    </div>

    <!-- Details -->

    <div style="
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:35px;">

        <div style="
        background:rgba(255,255,255,.08);
        padding:20px;
        border-radius:15px;">

            <h4 style="margin:0;color:#ccc;">Employee ID</h4>

            <p style="margin-top:10px;font-size:18px;">
                {{ empid }}
            </p>

        </div>

        <div style="
        background:rgba(255,255,255,.08);
        padding:20px;
        border-radius:15px;">

            <h4 style="margin:0;color:#ccc;">Full Name</h4>

            <p style="margin-top:10px;font-size:18px;">
                {{ fullname }}
            </p>

        </div>

        <div style="
        background:rgba(255,255,255,.08);
        padding:20px;
        border-radius:15px;">

            <h4 style="margin:0;color:#ccc;">Email</h4>

            <p style="margin-top:10px;font-size:18px;">
                {{ email }}
            </p>

        </div>

        <div style="
        background:rgba(255,255,255,.08);
        padding:20px;
        border-radius:15px;">

            <h4 style="margin:0;color:#ccc;">Department</h4>

            <p style="margin-top:10px;font-size:18px;">
                {{ department }}
            </p>

        </div>

        <div style="
        background:rgba(255,255,255,.08);
        padding:20px;
        border-radius:15px;">

            <h4 style="margin:0;color:#ccc;">Designation</h4>

            <p style="margin-top:10px;font-size:18px;">
                {{ designation }}
            </p>

        </div>

        <div style="
        background:rgba(255,255,255,.08);
        padding:20px;
        border-radius:15px;">

            <h4 style="margin:0;color:#ccc;">Phone Number</h4>

            <p style="margin-top:10px;font-size:18px;">
                {{ phone }}
            </p>

        </div>

        <div style="
        background:rgba(255,255,255,.08);
        padding:20px;
        border-radius:15px;">

            <h4 style="margin:0;color:#ccc;">Location</h4>

            <p style="margin-top:10px;font-size:18px;">
                {{ location }}
            </p>

        </div>

        <div style="
        background:rgba(255,255,255,.08);
        padding:20px;
        border-radius:15px;">

            <h4 style="margin:0;color:#ccc;">Status</h4>

            <p style="
            margin-top:10px;
            color:#4ade80;
            font-size:18px;">
                Active
            </p>

        </div>

    </div>

    <!-- Buttons -->

    <div style="
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:40px;">

        <a href="{{ url_for('users.dash_page') }}"
            style="
            text-decoration:none;
            background:#3b82f6;
            color:white;
            padding:15px 30px;
            border-radius:12px;
            font-weight:600;">

            <i class="fa-solid fa-house"></i>

            Dashboard

        </a>

        <a href="#"
            style="
            text-decoration:none;
            background:#16a34a;
            color:white;
            padding:15px 30px;
            border-radius:12px;
            font-weight:600;">

            <i class="fa-solid fa-user-pen"></i>

            Edit Profile

        </a>

    </div>

</div>

</body>

</html>
