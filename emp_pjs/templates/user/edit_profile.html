<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body style="
margin:0;
padding:0;
font-family:'Poppins',sans-serif;
background:url('../static/images/background.jpg') no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;">

    <div style="
    width:950px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);">

        <!-- Heading -->

        <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:35px;">

            <div>

                <h1 style="
                margin:0;
                font-size:36px;">
                    Edit Profile
                </h1>

                <p style="
                margin-top:8px;
                color:#ddd;">
                    Update your personal information
                </p>

            </div>

            <img
                src="{{ url_for('static', filename='images/profile.jpg') }}"
                alt="Profile"
                style="
                width:90px;
                height:90px;
                border-radius:50%;
                border:4px solid rgba(255,255,255,.35);">

        </div>

        <!-- Form -->

        <form method="POST">

            <div style="
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;">

                <div>

                    <label>Employee ID</label>

                    <input
                        type="text"
                        name="empid"
                        value="{{ empid }}"
                        readonly
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="fullname"
                        value="{{ fullname }}"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Email Address</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ email }}"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        name="phone"
                        value="{{ phone }}"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Department</label>

                    <input
                        type="text"
                        name="department"
                        value="{{ department }}"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Designation</label>

                    <input
                        type="text"
                        name="designation"
                        value="{{ designation }}"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Date of Birth</label>

                    <input
                        type="date"
                        name="dob"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Gender</label>

                    <select
                        name="gender"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                        <option>Male</option>

                        <option>Female</option>

                        <option>Other</option>

                    </select>

                </div>

            </div>

            <div style="margin-top:20px;">

                <label>Address</label>

                <textarea
                    name="address"
                    rows="4"
                    style="
                    width:100%;
                    margin-top:8px;
                    padding:14px;
                    border:none;
                    border-radius:12px;
                    background:rgba(255,255,255,.15);
                    color:white;
                    resize:none;">{{ address }}</textarea>

            </div>

            <!-- Buttons -->

            <div style="
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:35px;">

                <button
                    type="submit"
                    style="
                    background:#2563eb;
                    color:white;
                    border:none;
                    padding:15px 30px;
                    border-radius:12px;
                    font-size:16px;
                    cursor:pointer;">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>

                <button
                    type="reset"
                    style="
                    background:#dc2626;
                    color:white;
                    border:none;
                    padding:15px 30px;
                    border-radius:12px;
                    font-size:16px;
                    cursor:pointer;">

                    <i class="fa-solid fa-rotate-left"></i>

                    Reset

                </button>

                <a
                    href="#"
                    style="
                    background:#16a34a;
                    color:white;
                    text-decoration:none;
                    padding:15px 30px;
                    border-radius:12px;
                    font-size:16px;">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>

            </div>

        </form>

    </div>

</body>

</html>
