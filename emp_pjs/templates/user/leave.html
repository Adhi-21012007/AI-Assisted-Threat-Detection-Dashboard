<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Request</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body style="
margin:0;
padding:0;
font-family:'Poppins',sans-serif;
background:url('../static/images/background.jpg') no-repeat center center/cover;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;">

    <div style="
    width:950px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);">

        <!-- Header -->

        <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:35px;">

            <div>

                <h1 style="
                margin:0;
                font-size:36px;">
                    Leave Request
                </h1>

                <p style="
                margin-top:8px;
                color:#ddd;">
                    Submit your leave application
                </p>

            </div>

            <img
                src="{{ url_for('static', filename='images/profile.jpg') }}"
                alt="Profile"
                style="
                width:90px;
                height:90px;
                border-radius:50%;
                border:4px solid rgba(255,255,255,.35);">

        </div>

        <!-- Form -->

        <form method="POST">

            <div style="
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;">

                <div>

                    <label>Employee ID</label>

                    <input
                        type="text"
                        name="empid"
                        value="{{ empid }}"
                        readonly
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Employee Name</label>

                    <input
                        type="text"
                        name="fullname"
                        value="{{ fullname }}"
                        readonly
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>Leave Type</label>

                    <select
                        name="leave_type"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                        <option>Sick Leave</option>

                        <option>Casual Leave</option>

                        <option>Earned Leave</option>

                        <option>Emergency Leave</option>

                        <option>Maternity Leave</option>

                    </select>

                </div>

                <div>

                    <label>Number of Days</label>

                    <input
                        type="number"
                        name="days"
                        min="1"
                        placeholder="Enter Number of Days"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>From Date</label>

                    <input
                        type="date"
                        name="from_date"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

                <div>

                    <label>To Date</label>

                    <input
                        type="date"
                        name="to_date"
                        style="
                        width:100%;
                        margin-top:8px;
                        padding:14px;
                        border:none;
                        border-radius:12px;
                        background:rgba(255,255,255,.15);
                        color:white;">

                </div>

            </div>

            <div style="margin-top:20px;">

                <label>Reason for Leave</label>

                <textarea
                    name="reason"
                    rows="5"
                    placeholder="Enter your reason..."
                    style="
                    width:100%;
                    margin-top:8px;
                    padding:14px;
                    border:none;
                    border-radius:12px;
                    background:rgba(255,255,255,.15);
                    color:white;
                    resize:none;"></textarea>

            </div>

            <div style="margin-top:20px;">

                <label>Additional Remarks</label>

                <textarea
                    name="remarks"
                    rows="3"
                    placeholder="Optional..."
                    style="
                    width:100%;
                    margin-top:8px;
                    padding:14px;
                    border:none;
                    border-radius:12px;
                    background:rgba(255,255,255,.15);
                    color:white;
                    resize:none;"></textarea>

            </div>

            <!-- Leave Balance -->

            <div style="
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            margin-top:30px;">

                <div style="
                padding:20px;
                border-radius:15px;
                background:rgba(255,255,255,.10);
                text-align:center;">

                    <h3 style="margin:0;">Casual Leave</h3>

                    <h2 style="margin-top:15px;">6</h2>

                </div>

                <div style="
                padding:20px;
                border-radius:15px;
                background:rgba(255,255,255,.10);
                text-align:center;">

                    <h3 style="margin:0;">Sick Leave</h3>

                    <h2 style="margin-top:15px;">10</h2>

                </div>

                <div style="
                padding:20px;
                border-radius:15px;
                background:rgba(255,255,255,.10);
                text-align:center;">

                    <h3 style="margin:0;">Earned Leave</h3>

                    <h2 style="margin-top:15px;">15</h2>

                </div>

            </div>

            <!-- Buttons -->

            <div style="
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:35px;">

                <button
                    type="submit"
                    style="
                    background:#2563eb;
                    color:white;
                    border:none;
                    padding:15px 35px;
                    border-radius:12px;
                    font-size:16px;
                    cursor:pointer;">

                    <i class="fa-solid fa-paper-plane"></i>

                    Submit Request

                </button>

                <button
                    action = "#"
                    type="reset"
                    style="
                    background:#dc2626;
                    color:white;
                    border:none;
                    padding:15px 35px;
                    border-radius:12px;
                    font-size:16px;
                    cursor:pointer;">

                    <i class="fa-solid fa-rotate-left"></i>

                    Reset

                </button>

                <a
                    href="{{url_for('users.dash_page')}}"
                    style="
                    background:#16a34a;
                    color:white;
                    text-decoration:none;
                    padding:15px 35px;
                    border-radius:12px;">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>

            </div>

        </form>

    </div>

</body>

</html>
